[project]
name = "autodebug"
version = "0.8.0"
description = "Let an AI agent debug your program with the debugger of VS Code, Cursor or Visual Studio"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Documentation = "https://autodebug-tool.github.io/"
Source = "https://github.com/TEEJORAM/AutoDebug"
Issues = "https://github.com/TEEJORAM/AutoDebug/issues"

[project.scripts]
autodebug = "autodebug.cli:main"

[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Errors, likely bugs, dead code, and the simplest form of each idiom. Long lines are not gated: the agent
# instructions and the case-study page templates are prose and HTML.
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "PIE", "ARG", "RUF100", "E741"]
ignore = ["E501", "SIM112"]  # Windows environment variables keep their usual case (ProgramFiles)

[tool.ruff.lint.per-file-ignores]
"build_backend.py" = ["ARG001"]  # PEP 517 hook signatures
"tests/*" = ["ARG"]              # stand-ins keep the signatures of what they replace
