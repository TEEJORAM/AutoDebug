[project]
name = "autodebug"
version = "0.7.2"
description = "Let an AI agent debug your program with the debugger of VS Code, Cursor or Visual Studio"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Documentation = "https://teejoram.github.io/AutoDebug/"
Source = "https://github.com/TEEJORAM/AutoDebug"
Issues = "https://github.com/TEEJORAM/AutoDebug/issues"

[project.scripts]
autodebug = "autodebug.cli:main"

[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]
