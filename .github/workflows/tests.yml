name: AutoDebug test suite

# Fake/mock tests only; this workflow does not authorize real debugger control.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Diagnose Windows evidence backend (temporary)
        if: runner.os == 'Windows'
        run: python .github/diagnose_windows.py
      - name: Run the full unittest suite
        run: python .github/run_tests.py
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests build_backend.py
      - name: Check checked-out commit whitespace
        if: runner.os == 'Linux'
        run: git diff-tree --check --root -m -r HEAD
