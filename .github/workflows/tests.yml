name: AutoDebug test suite

# Python tests; the VS Code relay through the Node harness and the Visual Studio relay's
# core through its .NET harness. On Linux also gdb and debugpy (the real-debugger tests) and
# the ruff lint gate. A Windows job builds the Visual Studio extension.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install the real debuggers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdb g++
          python -m pip install -q debugpy
      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -q ruff
          ruff check src tools tests build_backend.py
      - name: Run the full unittest suite
        run: python .github/run_tests.py
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests build_backend.py
      - name: Check checked-out commit whitespace
        if: runner.os == 'Linux'
        run: git diff-tree --check --root -m -r HEAD
