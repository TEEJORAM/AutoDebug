name: AutoDebug test suite

# Fake/mock tests only; this workflow does not authorize real debugger control.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the full unittest suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests build_backend.py
      - name: Check checked-out commit whitespace
        run: git diff-tree --check --root -m -r HEAD

  windows-contracts:
    # Secure evidence persistence is unavailable on Windows. Do not label
    # this contract-only job as a passing full persistence/workflow suite.
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run platform-independent contracts only
        run: >-
          python -m unittest
          tests.test_adapters tests.test_capability_probing tests.test_sessions
          tests.test_router tests.test_plans tests.test_workflow
          tests.test_approvals tests.test_cross_platform_certification
          tests.test_t15_contract_conformance tests.test_server.TestBinding
          tests.test_server.TestOfflinePackaging -v
      - name: Compile all Python source and tests
        run: python -m compileall -q src tests build_backend.py
