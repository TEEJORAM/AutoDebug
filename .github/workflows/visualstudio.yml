name: Visual Studio extension

# Builds the AutoDebug extension for Visual Studio 2022 / 2026 with MSBuild and the
# VS SDK build tools. On main, publishes it as the release `visualstudio-v<version>`,
# which `autodebug setup visualstudio` downloads.
on:
  push:
  pull_request:
  # Run by hand to publish a test build from a branch, before it reaches main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2
      - name: Build the extension package
        shell: pwsh
        run: |
          msbuild src/autodebug/visualstudio/Extension/AutoDebug.VisualStudio.csproj -restore -p:Configuration=Release -v:minimal -nologo | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # Show the errors in the run summary (GitHub shows 10 per kind), or the end of the log.
          $errors = @(Select-String -Path build.log -Pattern '(^|: )error ' | Select-Object -ExpandProperty Line -Unique)
          if ($errors.Count -gt 0) { $errors | Select-Object -First 10 | ForEach-Object { "::error::$($_.Trim())" } }
          elseif ($code -ne 0) { Get-Content build.log -Tail 10 | ForEach-Object { "::error::$($_.Trim())" } }
          exit $code
      - name: Check the package
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Recurse -Filter *.vsix src/autodebug/visualstudio/Extension | Select-Object -First 1
          if (-not $vsix) {
            $built = (Get-ChildItem -Recurse -File src/autodebug/visualstudio/Extension/bin -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
            "::error::no .vsix was built; bin has: $built"
            exit 1
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead($vsix.FullName).Entries.FullName
          foreach ($needed in "extension.vsixmanifest", "AutoDebug.VisualStudio.dll", "AutoDebug.VisualStudio.pkgdef") {
            if ($names -notcontains $needed) { "::error::$($vsix.Name) has no $needed; it has: $($names -join ', ')"; exit 1 }
          }
          $zip = [IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          $reader = New-Object IO.StreamReader($zip.GetEntry("AutoDebug.VisualStudio.pkgdef").Open())
          $pkgdef = $reader.ReadToEnd(); $reader.Close(); $zip.Dispose()
          foreach ($needed in "6b0f6a8e-1f7d-4c3a-9a51-2d3c8e7b4f10", "AutoLoadPackages") {
            if ($pkgdef -notmatch [regex]::Escape($needed)) { "::error::the pkgdef does not register $needed"; exit 1 }
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $vsix.FullName out/AutoDebug.VisualStudio.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDebug.VisualStudio
          path: out/AutoDebug.VisualStudio.vsix

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: AutoDebug.VisualStudio
          path: out
      - name: Publish the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/autodebug/__init__.py)
          tag="visualstudio-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/AutoDebug.VisualStudio.vsix --clobber
            if [ "$GITHUB_REF" = refs/heads/main ]; then gh release edit "$tag" --prerelease=false --target "$GITHUB_SHA"; fi
          else
            flag=$([ "$GITHUB_REF" = refs/heads/main ] || echo --prerelease)
            gh release create "$tag" out/AutoDebug.VisualStudio.vsix --target "$GITHUB_SHA" $flag \
              --title "AutoDebug for Visual Studio $version" \
              --notes "Install with: autodebug setup visualstudio (Visual Studio 2022 or 2026)."
          fi
